services:
  backend: 
    build: ./backend
    container_name: backend
    image: jamscomputer/wanderlust:backend-1.0.0 
    environment:
      - MONGODB_URI=mongodb://mongodb/wanderlust
      - REDIS_URL=redis:6379
    ports:
      - 5000:5000
    depends_on:
      - mongodb
      - redis

  frontend: 
    build: ./frontend
    container_name: frontend
    image: jamscomputer/wanderlust:frontend-1.0.0 
    environment:
      - VITE_API_PATH=http://localhost:5000
    ports:
      - 5173:5173
    depends_on:
      - backend

  mongodb: 
    container_name: mongodb
    image: mongo 
    volumes:
      - ./backend/data:/data
    ports:
      - 27017:27017

  redis: 
    container_name: redis
    image: redis:alpine 
    ports:
      - 6379:6379


