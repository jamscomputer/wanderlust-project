apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: front
  ports:
  - port: 5173
    targetPort: 5173
    nodePort: 30000
    protocol: TCP
  # nodePort: 30000 is optional, if not specified, Kubernetes will assign a random port in the range 30000-32767
  