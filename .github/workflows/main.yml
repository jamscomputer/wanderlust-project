name: CI/CD Pipeline
on:
#Trigger manual workflow
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
    - 'frontend/**'
env:
  REGISTRY: jamscomputer
  REPOSITORY: wanderlust-project
  VERSION: v1
  TELEGRAM_CHAT_ID: "1713880824"
  
  
jobs:
  ci-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js environment
        uses: actions/setup-node@v3.9.1
        with:
          node-version: '21'
      - name: Install dependencies & run unit tests
        working-directory: frontend
        run: |
          npm install
          npm run test
        continue-on-error: true
    
  cd-frontend:
    runs-on: ubuntu-latest
    needs: [ci-frontend, cd-backend]
    steps:
      - uses: actions/checkout@v4
      ## script permissions
      - name: Setup notification script
        run: |
          mkdir -p scripts
          cp .github/scripts/notify.sh scripts/
          chmod +x scripts/notify.sh
          ls -la scripts/notify.sh
      - name: Info repo
        working-directory: frontend
        run: |
          VERSION=$(jq -r '.version' ./package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "COMMIT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/setup-qemu-action@v3.6.0
      - uses: docker/setup-buildx-action@v3.10.0
#Notify
      - name: Send Start Notification
        if: success()
        env:
          BOT_URL: "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage"
        run: |
          export BOT_URL="${BOT_URL}"
          bash scripts/notify.sh "start" "${{ env.VERSION }}" "${{ env.COMMIT_SHA }}" "${{env.BUILD_DATE}}"

      - name: Docker Build
        working-directory: frontend
        run: |
          docker build -t $REGISTRY/$REPOSITORY:frontent-$VERSION .
          docker push $REGISTRY/$REPOSITORY:frontent-$VERSION
#Notify
      - name: Send Success Notification
        if: success()
        env:
          BOT_URL: "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage"
        run: |
          export BOT_URL="${BOT_URL}"
          bash scripts/notify.sh "success" "${{ env.VERSION }}" "${{ env.COMMIT_SHA }}" "${{env.BUILD_DATE}}"    
          
      - name: Send Failure Notification
        if: failure()
        env:
          BOT_URL: "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage"
        run: |
          export BOT_URL="${BOT_URL}"
          bash scripts/notify.sh "failure" "${{ env.VERSION }}" "${{ env.COMMIT_SHA }}" "${{env.BUILD_DATE}}"

  ci-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js environment
        uses: actions/setup-node@v3.9.1
        with:
          node-version: '21'
      - name: Install dependencies & run tests
        working-directory: backend
        run: | 
          npm install
          npm run test
  
  cd-backend:
    runs-on: ubuntu-latest
    needs: [ci-backend]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/setup-qemu-action@v3.6.0
      - uses: docker/setup-buildx-action@v3.10.0
      - name: Docker Build
        working-directory: backend
        run: |
          docker build -t $REGISTRY/$REPOSITORY:backend-$VERSION .
          docker push $REGISTRY/$REPOSITORY:backend-$VERSION
     
