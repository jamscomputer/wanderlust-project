name: CI
on:
#Trigger manual workflow
  workflow_dispatch:
  push:
    branches: [ main ]
env:
  REGISTRY: jamscomputer
  REPOSITORY: wanderlust-project
  VERSION: v1

jobs:
  ci-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js environment
        uses: actions/setup-node@v3.9.1
        with:
          node-version: '21'
      - name: Install dependencies
        run: cd frontend; npm install
      - name: run tests
        run: | 
          cd frontend
          npm run test
        continue-on-error: true
    
  cd-frontend:
    runs-on: ubuntu-latest
    needs: [ci-frontend, cd-backend]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/setup-qemu-action@v3.6.0
      - uses: docker/setup-buildx-action@v3.10.0
      - name: Docker Build
        run: |
          cd frontend
          docker build -t $REGISTRY/$REPOSITORY:frontent-$VERSION .
          docker push $REGISTRY/$REPOSITORY:frontent-$VERSION
          
  ci-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js environment
        uses: actions/setup-node@v3.9.1
        with:
          node-version: '21'
      - name: Install dependencies
        run: cd backend; npm install
      - name: run tests
        run: | 
          cd backend
          npm run test

  cd-backend:
    runs-on: ubuntu-latest
    needs: [ci-backend]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/setup-qemu-action@v3.6.0
      - uses: docker/setup-buildx-action@v3.10.0
      - name: Docker Build
        run: |
          cd backend
          docker build -t $REGISTRY/$REPOSITORY:backend-$VERSION .
          docker push $REGISTRY/$REPOSITORY:backend-$VERSION
     
